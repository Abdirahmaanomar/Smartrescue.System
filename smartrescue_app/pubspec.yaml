name: smartrescue_app
description: SmartRescue Emergency Response Mobile App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Audio Feedback
  audioplayers: ^6.0.0

  # Networking
  http: ^1.2.2

  # Connectivity / Offline Detection
  connectivity_plus: ^6.0.3

  # State Management
  provider: ^6.1.2

  # Local Storage
  shared_preferences: ^2.3.2

  # Maps & Location
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.2
  permission_handler: ^11.3.1
  url_launcher: ^6.3.0

  # Image Picker
  image_picker: ^1.1.2

  # Date formatting
  intl: ^0.19.0

  # Cached network images
  cached_network_image: ^3.4.1

  # Icons
  cupertino_icons: ^1.0.8
  font_awesome_flutter: ^11.0.0
  toastification: ^3.2.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/sounds/

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/launcher_icon.png"
  min_sdk_android: 21
  web:
    generate: false
  windows:
    generate: false
